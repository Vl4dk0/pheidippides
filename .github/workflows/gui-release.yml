# Called by dist's release.yml after it has created the GitHub Release, so the
# desktop bundles and the updater's latest.json land on that same release.
name: GUI release

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
    secrets:
      # Passed by name from release.yml. The release environment holds the
      # values; a caller that uses secrets: inherit would expose every other
      # repository secret to this workflow too.
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: true

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal .dmg serves Apple Silicon and Intel Macs.
          - os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          # Oldest supported Ubuntu keeps the AppImage's glibc floor low.
          - os: ubuntu-22.04
            args: ""
            rust-targets: ""
          - os: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.os }}
    # Tag-only deployment policy and the updater signing key live on this
    # environment. The caller cannot set environment on a reusable-workflow job.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The default persists a contents: write token in the checkout while
          # pnpm build runs. tauri-action receives GITHUB_TOKEN itself.
          persist-credentials: false
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/gui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/gui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install frontend dependencies
        working-directory: apps/gui
        run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/gui
          tagName: ${{ fromJson(inputs.plan).announcement_tag }}
          args: ${{ matrix.args }}
          # NSIS installs per user without admin rights, so updates stay silent.
          updaterJsonPreferNsis: true
          retryAttempts: 2
