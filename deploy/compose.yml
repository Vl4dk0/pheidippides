services:
  phi-server:
    # Published multi-arch image; pin PHI_TAG so upgrades are deliberate.
    image: "${PHI_IMAGE:-ghcr.io/vl4dk0/phi-server}:${PHI_TAG:-0.3.0}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:8443:8443"
    env_file: .env
    environment:
      PHI_SERVER_DATA_DIR: /data
      PHI_SERVER_LISTEN: 0.0.0.0:8443
    volumes:
      - phi-data:/data
      - type: bind
        source: ./server.toml
        target: /etc/phi/server.toml
        read_only: true
        bind:
          create_host_path: false
    # Root is read-only. The process only writes the /data volume (db, blobs,
    # ACME cache); SQLite temp files stay beside the database, so no tmpfs.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # The slim runtime has no HTTP probe tool; monitor /healthz from the host.

volumes:
  phi-data:
