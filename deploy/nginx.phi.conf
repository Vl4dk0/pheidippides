# nginx in front of phi-server (tls.mode = "off" on 127.0.0.1:8443).
# Replace phi.example.org, enable this HTTP site, then run:
# sudo certbot --nginx -d phi.example.org
# Certbot adds the HTTPS listener/certificates and can redirect HTTP to HTTPS.
server {
    listen 80;
    server_name phi.example.org;

    # 25 MiB attachments become about 33.4 MiB in base64; allow JSON/tag overhead.
    client_max_body_size 40m;

    location / {
        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Long-poll requests wait up to 900 s; keep proxy timeouts above that
        # or idle agents get cut off and reconnect-loop.
        proxy_read_timeout 960s;
        proxy_send_timeout 960s;
        # Deliver events immediately.
        proxy_buffering off;
    }
}
