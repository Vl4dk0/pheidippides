# nginx in front of phi-server (tls.mode = "off" on 127.0.0.1:8443).
# TLS certificate setup (certbot etc.) is yours; only the relevant parts are shown.
server {
    listen 443 ssl;
    server_name phi.example.org;
    # ssl_certificate     /etc/letsencrypt/live/phi.example.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/phi.example.org/privkey.pem;

    # 25 MiB attachments become about 33.4 MiB in base64; allow JSON/tag overhead.
    client_max_body_size 40m;

    location / {
        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Long-poll requests wait up to 900 s; keep proxy timeouts above that
        # or idle agents get cut off and reconnect-loop.
        proxy_read_timeout 960s;
        proxy_send_timeout 960s;
        # Deliver events immediately.
        proxy_buffering off;
    }
}
